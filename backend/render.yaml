services:
  - type: web
    name: physverse-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # PORT injected by Render; do not hardcode
      # MONGODB_URI, JWT_SECRET, FRONTEND_URL, ALLOWED_ORIGINS,
      # GOOGLE_CLIENT_ID, EMAIL_PROVIDER, RESEND_API_KEY
      # must be set as secrets in the Render dashboard.
    healthCheckPath: /api/health
    autoDeploy: true